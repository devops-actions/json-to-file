name: Lint GitHub Actions workflows
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read
  pull-requests: write

jobs:
  actionlint:
    uses: devops-actions/.github/.github/workflows/actionlint.yml@93304b8834bc1f3ae295b3045a0aa9e5a44fa3aa # main
    permissions:
      contents: read
      pull-requests: write
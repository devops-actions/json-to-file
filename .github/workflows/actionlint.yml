name: Lint GitHub Actions workflows
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read
  pull-requests: write

jobs:
  actionlint:
    uses: devops-actions/.github/.github/workflows/actionlint.yml@32339973f79273aa46e37f663e6b9bef0dd2fcd3 # main
    permissions:
      contents: read
      pull-requests: write
name: Lint GitHub Actions workflows
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read
  pull-requests: write

jobs:
  actionlint:
    uses: devops-actions/.github/.github/workflows/actionlint.yml@97cb794781522d095e049b3201323325c30d4fad # main
    permissions:
      contents: read
      pull-requests: write
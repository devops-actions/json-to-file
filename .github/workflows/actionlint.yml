name: Lint GitHub Actions workflows
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read
  pull-requests: write

jobs:
  actionlint:
    uses: devops-actions/.github/.github/workflows/actionlint.yml@273073a94b9e270dfc538a72602cb39c85685b90 # main
    permissions:
      contents: read
      pull-requests: write
name: Lint GitHub Actions workflows
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read
  pull-requests: write

jobs:
  actionlint:
    uses: devops-actions/.github/.github/workflows/actionlint.yml@06c84b83819b55cc0282286ece6dfc878a7a7fa5 # main
    permissions:
      contents: read
      pull-requests: write
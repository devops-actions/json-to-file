name: Lint GitHub Actions workflows
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read
  pull-requests: write

jobs:
  actionlint:
    uses: devops-actions/.github/.github/workflows/actionlint.yml@3abe9f6710c33ede76f8a506b2889ee46a2c9646 # main
    permissions:
      contents: read
      pull-requests: write
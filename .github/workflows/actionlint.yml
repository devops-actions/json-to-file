name: Lint GitHub Actions workflows
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read
  pull-requests: write

jobs:
  actionlint:
    uses: devops-actions/.github/.github/workflows/actionlint.yml@327cf0513536a46d3ad86e4910e940a6e68261b9 # main
    permissions:
      contents: read
      pull-requests: write
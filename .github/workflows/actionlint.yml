name: Lint GitHub Actions workflows
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read
  pull-requests: write

jobs:
  actionlint:
    uses: devops-actions/.github/.github/workflows/actionlint.yml@72f72c4ce25d0ab32530f581be0de7e914365c29 # main
    permissions:
      contents: read
      pull-requests: write
name: Lint GitHub Actions workflows
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read
  pull-requests: write

jobs:
  actionlint:
    uses: devops-actions/.github/.github/workflows/actionlint.yml@ed6b9ab5002c46eb78ceba4abdfc4ae46618e107 # main
    permissions:
      contents: read
      pull-requests: write
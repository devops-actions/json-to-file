name: Lint GitHub Actions workflows
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read
  pull-requests: write

jobs:
  actionlint:
    uses: devops-actions/.github/.github/workflows/actionlint.yml@bb1b429a44f5ffc7d548bd55f4f792a2de7ab083 # main
    permissions:
      contents: read
      pull-requests: write
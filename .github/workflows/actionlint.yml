name: Lint GitHub Actions workflows
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read
  pull-requests: write

jobs:
  actionlint:
    uses: devops-actions/.github/.github/workflows/actionlint.yml@1025096c3a41498850f3457dfec7bd1a643424ef # main
    permissions:
      contents: read
      pull-requests: write
name: Lint GitHub Actions workflows
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read
  pull-requests: write

jobs:
  actionlint:
    uses: devops-actions/.github/.github/workflows/actionlint.yml@a2dcba26c2b4e873ec3b9c6291ac680e2ea452a2 # main
    permissions:
      contents: read
      pull-requests: write
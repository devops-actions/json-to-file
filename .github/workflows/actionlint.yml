name: Lint GitHub Actions workflows
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read
  pull-requests: write

jobs:
  actionlint:
    uses: devops-actions/.github/.github/workflows/actionlint.yml@1ee1515c3cbefa23a39b2592211075e13e98d421 # main
    permissions:
      contents: read
      pull-requests: write
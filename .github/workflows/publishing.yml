name: Publishing the action to the marketplace

on:   
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

  workflow_dispatch:  
  
permissions:
  contents: read
    
jobs:
  test-local-action:
    runs-on: ubuntu-latest
    steps: 
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./
        name: json to file
        with:
          json: '{"foo": "test"}'
          filename: 'test.json'
        id: store-json

      - shell: pwsh        
        run: |
         $content = Get-Content -Path 'test.json'
         $test = $content | ConvertFrom-Json
         if ($test.foo -eq 'test') {
            Write-Host "File found correct"
         } 
         else {
            Write-Host "Found this json:"
            Write-Host $test | ConvertTo-Json
         }
            
      - name: Upload result file as artefact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v2.3.1
        with: 
          name: test
          path: test.json

  release:
    name: Release with SBOM and attestations
    needs: test-local-action
    # Creates the GitHub release for this tag with the action files, a source archive and
    # SPDX/CycloneDX SBOMs attached, each with a verified artifact attestation.
    permissions:
      contents: write       # create the release and upload its assets
      id-token: write       # Sigstore keyless signing for the attestations
      attestations: write   # store the attestations
    uses: devops-actions/.github/.github/workflows/rw-release-attestation.yml@7173ecb27a93c3d22f87ff0dc735dddb189a20b3 # v1.3.0

  notify:
    needs: release
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Show release result
        env:
          RESULT: ${{ needs.release.result }}
          URL: ${{ needs.release.outputs.release-url }}
        run: echo "Release $GITHUB_REF_NAME - $RESULT $URL"

      - uses: rajbos-actions/slack@ed1309ab9862e57e9e583e51c7889486b9a00b0f # v2.0.0
        with:
          status: ${{ needs.release.result }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
